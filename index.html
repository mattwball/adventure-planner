<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketPath - Adventure Planning & Packing List</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for parsing React/JSX -->
  <script src="https://unpkg.com/@babel/standalone@8.1.1/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@1.71.0"></script>
  <!-- Leaflet (interactive map for picking destinations) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .pp-stop-marker {
      background: #10b981; color: #022c22; font-weight: 800; font-size: 13px;
      width: 28px; height: 28px; border-radius: 9999px; border: 2px solid #ecfdf5;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.45);
    }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const {useState, useEffect, useMemo} = React;

    // Helper Component for Lucide Icons
    const Icon = ({name, fallback, className = "w-5 h-5"}) => {
      const iconRef = React.useRef(null);

      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = '';
          const icons = window.lucide.icons || {};
          const def = icons[name] || icons[fallback] || icons.CircleHelp || icons.HelpCircle;
          if (!def) return; // unknown icon: show nothing rather than break the page
          iconRef.current.appendChild(window.lucide.createElement(def));
          if (className) {
            const svg = iconRef.current.querySelector('svg');
            if (svg) svg.setAttribute('class', className);
          }
        }
      }, [name, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center" />;
    };

    // --- ACTIVITIES DEFINITION ---
    const AVAILABLE_ACTIVITIES = [
      {id: 'hike', name: 'Hiking', iconName: 'Mountain', desc: 'Trails, elevation, and nature walks'},
      {id: 'biking', name: 'Mountain Biking', iconName: 'Bike', desc: 'Singletrack, dirt roads, or trails'},
      {id: 'swimming', name: 'Swimming', iconName: 'Waves', desc: 'Lakes, oceans, or pools'},
      {id: 'camping', name: 'Camping', iconName: 'Tent', desc: 'Overnight tent or wilderness stay'},
      {id: 'motocamping', name: 'Moto Camping', iconName: 'Motorbike', fallbackIcon: 'Gauge', desc: 'Motorcycle trips with camp gear on the bike'},
      {id: 'sightseeing', name: 'Sightseeing', iconName: 'Camera', desc: 'Town exploration, light walking'},
    ];

    // --- FAMILY PROFILES ---
    // Each person's details drive their packing list (sizes, age-based extras, etc.).
    // Later this can become an onboarding step where any family adds their own people.
    const FAMILY = [
      {id: 'penny', name: 'Penny', gender: 'female', age: 12},
      {id: 'leon', name: 'Leon', gender: 'male', age: 9},
      {id: 'niko', name: 'Niko', gender: 'male', age: 6},
    ];

    // Shorten long place names like "Moab, Grand County, Utah, United States" -> "Moab, Grand County"
    const shortPlaceName = (displayName = '') => displayName.split(',').slice(0, 2).map(s => s.trim()).join(', ');

    // --- MAP DESTINATION PICKER ---
    // Search for a place or tap the map to drop a pin; then choose how many nights to stay.
    // Uses OpenStreetMap tiles and the free Nominatim geocoder.
    const MapPicker = ({locations, onAdd}) => {
      const mapEl = React.useRef(null);
      const mapRef = React.useRef(null);
      const stopsLayerRef = React.useRef(null);
      const tempMarkerRef = React.useRef(null);
      const [query, setQuery] = useState('');
      const [results, setResults] = useState([]);
      const [searching, setSearching] = useState(false);
      const [searchError, setSearchError] = useState('');
      const [pending, setPending] = useState(null); // {name, lat, lon, loading}
      const [nights, setNights] = useState(2);

      const showTempMarker = (lat, lon) => {
        const map = mapRef.current;
        if (!map) return;
        if (tempMarkerRef.current) tempMarkerRef.current.remove();
        tempMarkerRef.current = L.circleMarker([lat, lon], {
          radius: 10, color: '#fbbf24', weight: 3, fillColor: '#fbbf24', fillOpacity: 0.35
        }).addTo(map);
      };

      const clearTempMarker = () => {
        if (tempMarkerRef.current) {
          tempMarkerRef.current.remove();
          tempMarkerRef.current = null;
        }
      };

      // Create the map once
      useEffect(() => {
        if (!window.L || !mapEl.current || mapRef.current) return;
        const map = L.map(mapEl.current).setView([39.5, -111.5], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        stopsLayerRef.current = L.layerGroup().addTo(map);

        // Drop a pin by tapping the map
        map.on('click', async (e) => {
          const {lat, lng} = e.latlng;
          showTempMarker(lat, lng);
          setResults([]);
          setPending({name: 'Dropped pin', lat, lon: lng, loading: true});
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=12&lat=${lat}&lon=${lng}`);
            const data = await res.json();
            const name = data.name || shortPlaceName(data.display_name) || 'Dropped pin';
            setPending(p => (p && p.lat === lat ? {...p, name, loading: false} : p));
          } catch (err) {
            setPending(p => (p && p.lat === lat ? {...p, loading: false} : p));
          }
        });

        mapRef.current = map;
        return () => {
          map.remove();
          mapRef.current = null;
        };
      }, []);

      // Draw numbered markers for each stop
      useEffect(() => {
        const map = mapRef.current;
        const layer = stopsLayerRef.current;
        if (!map || !layer) return;
        layer.clearLayers();
        const pts = [];
        locations.forEach((loc, idx) => {
          if (loc.lat == null) return;
          pts.push([loc.lat, loc.lon]);
          L.marker([loc.lat, loc.lon], {
            icon: L.divIcon({className: '', html: `<div class="pp-stop-marker">${idx + 1}</div>`, iconSize: [28, 28], iconAnchor: [14, 14]})
          }).bindTooltip(`${loc.name} · ${loc.nights} night${loc.nights === 1 ? '' : 's'}`).addTo(layer);
        });
        if (pts.length === 1) map.setView(pts[0], Math.max(map.getZoom(), 8));
        if (pts.length > 1) map.fitBounds(pts, {padding: [40, 40], maxZoom: 10});
      }, [locations]);

      const runSearch = async (e) => {
        e?.preventDefault();
        const q = query.trim();
        if (!q) return;
        setSearching(true);
        setSearchError('');
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}`);
          const data = await res.json();
          setResults(data);
          if (data.length === 0) setSearchError('No places found. Try a different name, or tap the map to drop a pin.');
        } catch (err) {
          setSearchError('Search is unavailable right now. You can still tap the map to drop a pin.');
        }
        setSearching(false);
      };

      const chooseResult = (r) => {
        const lat = parseFloat(r.lat);
        const lon = parseFloat(r.lon);
        mapRef.current?.setView([lat, lon], 10);
        showTempMarker(lat, lon);
        setResults([]);
        setPending({name: shortPlaceName(r.display_name), lat, lon, loading: false});
      };

      const confirmStop = () => {
        if (!pending) return;
        onAdd({
          id: `loc_${Date.now()}`,
          name: pending.name.trim() || 'Dropped pin',
          lat: pending.lat,
          lon: pending.lon,
          nights: Math.max(0, parseInt(nights, 10) || 0)
        });
        clearTempMarker();
        setPending(null);
        setNights(2);
        setQuery('');
      };

      const cancelStop = () => {
        clearTempMarker();
        setPending(null);
      };

      return (
        <div className="space-y-2">
          <form onSubmit={runSearch} className="relative flex gap-2">
            <input
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Search a park, town, or campground..."
              className="flex-1 bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"
            />
            <button
              type="submit"
              disabled={searching}
              className="shrink-0 bg-emerald-500/20 border border-emerald-500 text-emerald-300 rounded-xl px-4 text-sm font-semibold disabled:opacity-50"
            >
              {searching ? '...' : 'Search'}
            </button>

            {results.length > 0 && (
              <ul className="absolute left-0 right-0 top-full mt-1 z-[1100] bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-2xl">
                {results.map(r => (
                  <li key={r.place_id}>
                    <button
                      type="button"
                      onClick={() => chooseResult(r)}
                      className="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-slate-800 border-b border-slate-800 last:border-0"
                    >
                      <span className="font-semibold">{shortPlaceName(r.display_name)}</span>
                      <span className="block text-xs text-slate-500 truncate">{r.display_name}</span>
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </form>
          {searchError && <p className="text-xs text-amber-400">{searchError}</p>}

          <div className="relative">
            <div ref={mapEl} className="h-72 sm:h-80 w-full rounded-xl border border-slate-700 overflow-hidden z-0" />

            {pending && (
              <div className="absolute inset-x-3 bottom-3 z-[1000] bg-slate-900/95 border border-emerald-600/60 rounded-xl p-4 shadow-2xl space-y-3">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Stop name</label>
                  <input
                    type="text"
                    value={pending.loading ? 'Finding place name...' : pending.name}
                    disabled={pending.loading}
                    onChange={(e) => setPending(p => ({...p, name: e.target.value}))}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-sm font-semibold text-white">How many nights here?</span>
                  <div className="flex items-center gap-2">
                    <button type="button" onClick={() => setNights(n => Math.max(0, n - 1))} className="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-lg leading-none">−</button>
                    <span className="w-8 text-center font-bold text-emerald-300">{nights}</span>
                    <button type="button" onClick={() => setNights(n => Math.min(60, n + 1))} className="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-lg leading-none">+</button>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={cancelStop} className="flex-1 py-2 rounded-lg border border-slate-700 text-sm text-slate-300">Cancel</button>
                  <button type="button" onClick={confirmStop} disabled={pending.loading} className="flex-1 py-2 rounded-lg bg-emerald-500 text-slate-950 text-sm font-bold disabled:opacity-50">Add stop</button>
                </div>
              </div>
            )}
          </div>
          <p className="text-xs text-slate-500">Tip: tap anywhere on the map to drop a pin.</p>
        </div>
      );
    };

    // Shared family gear (tent, stove, first aid...) lives on its own list so it isn't repeated per kid
    const FAMILY_GEAR = {id: 'family', name: 'Family Gear', shared: true};
    const PROFILES = [...FAMILY, FAMILY_GEAR];

    const CATEGORY_ORDER = [
      'Clothing & Apparel',
      'Activity Gear',
      'Weather & Climate Essentials',
      'Toiletries & Personal Care',
      'General & Logistics'
    ];

    // --- DATE HELPERS (dates are YYYY-MM-DD strings) ---
    const addDays = (dateStr, n) => {
      const d = new Date(dateStr + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    };
    const localToday = () => {
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    };
    const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
    const shiftYears = (dateStr, years) => {
      const md = dateStr.slice(4) === '-02-29' ? '-02-28' : dateStr.slice(4);
      return `${Number(dateStr.slice(0, 4)) - years}${md}`;
    };
    const shortDate = (dateStr) => new Date(dateStr + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', timeZone: 'UTC'});

    // --- WEATHER (Open-Meteo, free, no key) ---
    const FORECAST_WINDOW_DAYS = 15; // Open-Meteo forecasts about 16 days ahead
    const DAILY_VARS = 'temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_speed_10m_max';
    const UNITS = '&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto';
    const nums = (arr = []) => arr.filter(v => v != null);
    const sum = (arr) => nums(arr).reduce((s, v) => s + v, 0);
    const avg = (arr) => arr.reduce((s, v) => s + v, 0) / arr.length;

    // Get weather for one stop over the dates you'll actually be there.
    // Within ~2 weeks: real forecast. Further out: typical weather from the same dates in the last 3 years.
    const fetchStopWeather = async (stop, from, to) => {
      const base = {displayName: stop.name, from, to};
      try {
        if (stop.lat == null || stop.lon == null) throw new Error('No coordinates');
        const today = localToday();

        if (daysBetween(today, to) <= FORECAST_WINDOW_DAYS && daysBetween(today, from) >= -60) {
          const res = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${stop.lat}&longitude=${stop.lon}&daily=${DAILY_VARS},precipitation_probability_max&start_date=${from}&end_date=${to}${UNITS}`
          );
          const d = (await res.json()).daily;
          if (!d || !d.time || d.time.length === 0) throw new Error('No forecast data');
          const rainChance = Math.round(Math.max(0, ...nums(d.precipitation_probability_max)));
          return {
            ...base,
            source: 'forecast',
            maxTemp: Math.round(Math.max(...nums(d.temperature_2m_max))),
            minTemp: Math.round(Math.min(...nums(d.temperature_2m_min))),
            rainChance,
            hasRain: rainChance > 35 || sum(d.precipitation_sum) > 0.1,
            hasSnow: sum(d.snowfall_sum) > 0,
            maxWind: Math.round(Math.max(0, ...nums(d.wind_speed_10m_max)))
          };
        }

        const years = await Promise.all([1, 2, 3].map(async (y) => {
          try {
            const res = await fetch(
              `https://archive-api.open-meteo.com/v1/archive?latitude=${stop.lat}&longitude=${stop.lon}&daily=${DAILY_VARS}&start_date=${shiftYears(from, y)}&end_date=${shiftYears(to, y)}${UNITS}`
            );
            const d = (await res.json()).daily;
            return d && d.time && d.time.length ? d : null;
          } catch (e) {
            return null;
          }
        }));
        const valid = years.filter(Boolean);
        if (valid.length === 0) throw new Error('No historical data');

        const wetYears = valid.filter(d => nums(d.precipitation_sum).some(v => v >= 0.04)).length;
        const snowYears = valid.filter(d => sum(d.snowfall_sum) > 0).length;
        const rainChance = Math.round((wetYears / valid.length) * 100);
        return {
          ...base,
          source: 'typical',
          years: valid.length,
          maxTemp: Math.round(avg(valid.map(d => Math.max(...nums(d.temperature_2m_max))))),
          minTemp: Math.round(avg(valid.map(d => Math.min(...nums(d.temperature_2m_min))))),
          rainChance,
          hasRain: rainChance > 35,
          hasSnow: snowYears > 0,
          maxWind: Math.round(avg(valid.map(d => Math.max(0, ...nums(d.wind_speed_10m_max)))))
        };
      } catch (err) {
        return {...base, source: 'unavailable'};
      }
    };

    // Combine every stop into one "worst case" picture for the whole trip
    const summarizeWeather = (stops) => {
      const ok = stops.filter(w => w.source !== 'unavailable');
      const missing = stops.filter(w => w.source === 'unavailable').map(w => w.displayName);
      const minTemp = ok.length ? Math.min(...ok.map(w => w.minTemp)) : null;
      const maxTemp = ok.length ? Math.max(...ok.map(w => w.maxTemp)) : null;
      return {
        missing,
        minTemp,
        maxTemp,
        hasRain: ok.some(w => w.hasRain),
        hasSnow: ok.some(w => w.hasSnow),
        isCold: minTemp != null && minTemp < 50,
        isFreezing: minTemp != null && minTemp <= 32,
        isHot: maxTemp != null && maxTemp > 78,
        isVeryHot: maxTemp != null && maxTemp >= 90,
        isWindy: ok.some(w => w.maxWind >= 25)
      };
    };

    const slug = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const activityName = (id) => (id === 'always' ? 'Every trip' : (AVAILABLE_ACTIVITIES.find(a => a.id === id)?.name || id));

    // --- PACKING LIST ENGINE ---
    // Builds one profile's list from trip length, weather, activities, and that profile's saved items.
    const buildPackingList = (profile, {days, activities, w, saved = []}) => {
      const cats = {};
      CATEGORY_ORDER.forEach(c => { cats[c] = []; });
      const add = (cat, text, note, extra = {}) => {
        if (!cats[cat]) cats[cat] = [];
        const exists = Object.values(cats).some(list => list.some(i => i.text.toLowerCase() === text.toLowerCase()));
        if (!exists) cats[cat].push({id: `${profile.id}_${slug(text)}`, text, note, ...extra});
      };
      const has = (a) => activities.includes(a);
      const C = 'Clothing & Apparel', A = 'Activity Gear', W = 'Weather & Climate Essentials', T = 'Toiletries & Personal Care', G = 'General & Logistics';

      // If any stop's weather couldn't load, pack for rain and cold just in case
      const unsure = w.missing.length > 0;
      const unsureNote = 'Weather unavailable for part of the trip, packed just in case';
      const rain = w.hasRain || unsure;
      const cold = w.isCold || unsure;
      const lowNote = w.minTemp != null ? `Lows around ${w.minTemp}°F` : undefined;
      const sunny = w.isHot || has('swimming') || has('hike') || has('biking');
      const camping = has('camping') || has('motocamping');

      if (profile.shared) {
        // ---------- FAMILY GEAR (shared items, packed once) ----------
        if (camping) {
          const tent = has('motocamping') && !has('camping') ? 'Compact Tent (packs on the bike)'
            : has('motocamping') ? 'Tent (compact one if it rides on the moto)' : 'Tent';
          add(A, tent);
          add(A, 'Camp Stove, Fuel & Cook Kit');
          add(A, 'Plates, Cups & Utensils');
          add(A, 'Lantern');
          if (rain) add(A, 'Tarp / Rain Fly', rain && !w.hasRain ? unsureNote : 'Rain in the forecast');
          if (w.isWindy) add(A, 'Extra Stakes & Guy Lines', 'Windy conditions expected');
          if (w.isFreezing) add(A, 'Hand Warmers', 'Freezing nights expected');
        }
        if (has('biking')) {
          add(A, 'Bike Pump & Repair Tools');
          add(A, 'Bike Rack');
        }
        if (has('motocamping')) {
          add(A, 'Luggage, Straps & Bungee Net');
          add(A, 'Tire Repair Kit & Mini Pump');
          add(A, 'Bike Tools, Chain Lube & Spare Fuses');
          add(A, 'Fuel Plan / Extra Fuel Bottle', 'Check gas stops on the route');
        }
        if (has('hike')) add(A, 'Trail Map (downloaded offline)');
        if (has('swimming') && w.isHot) add(A, 'Sun Shade or Umbrella?');

        if (rain) add(W, 'Waterproof / Dry Bags');
        if (w.isHot) add(W, 'Extra Water & Electrolytes', `Highs up to ${w.maxTemp}°F`);
        if (w.hasSnow) add(W, 'Ice Scraper & Snow Shovel?', 'Snow possible');
        if (sunny) add(W, 'Sunscreen');

        add(T, 'First Aid Kit (bandaids, ibuprofen, kids\' meds)');
        add(T, 'Insect Repellent');
        add(T, 'Toothpaste & Floss');
        add(T, 'Soap / Bodywash');

        add(G, 'ID, Credit Cards & Cash');
        add(G, 'Portable Power Bank & Charging Cables');
        add(G, 'Download Offline Map');
        add(G, 'Trash Bags');
        add(G, 'Multi-tool and/or Pocket Knife');
        add(G, 'Snacks for the Drive');
      } else {
        // ---------- A KID'S PERSONAL LIST ----------
        const age = profile.age;
        const wet = rain || w.hasSnow || has('swimming');
        const shirts = Math.max(2, Math.ceil(days / 1.5));
        const bottoms = Math.max(1, Math.ceil(days / 2.5));

        // Clothing follows the temperature range
        if (w.isHot && !cold) {
          add(C, `${shirts}x T-Shirts`);
          add(C, `${bottoms}x Shorts`);
        } else if (cold && !w.isHot) {
          add(C, `${shirts}x Long-Sleeve Shirts`);
          add(C, `${bottoms}x Long Pants`);
        } else if (cold && w.isHot) {
          add(C, `${shirts}x Shirts (mix of short & long sleeve)`, 'Big temperature swings');
          add(C, `${bottoms}x Pants & Shorts (mix)`);
        } else {
          add(C, `${shirts}x Shirts`);
          add(C, `${bottoms}x Pants / Shorts`);
        }
        add(C, `${days + 1}x Underwear`);
        add(C, `${days + 1 + (wet ? 2 : 0)}x Socks`, wet ? 'Includes 2 extra pairs for wet days' : undefined);
        add(C, '1x Sleepwear');
        if (age < 12) add(C, '2x Extra Change of Clothes', 'Backup for spills & mud');

        // Weather
        if (rain) add(W, 'Rain Jacket', w.hasRain ? 'Rain expected' : unsureNote);
        if (rain && (has('hike') || camping)) add(W, 'Waterproof Shoes or Boots?');
        if (cold) {
          add(W, 'Warm Jacket', w.isCold ? lowNote : unsureNote);
          add(W, 'Warm Base Layer', 'For chilly mornings & nights');
          add(W, 'Beanie & Gloves');
        }
        if (w.isFreezing) {
          add(W, 'Thermal Base Layers (top & bottom)', lowNote);
          add(W, 'Warm Wool Socks');
        }
        if (w.hasSnow) {
          add(W, 'Snow Pants & Snow Boots', 'Snow possible');
          add(W, 'Waterproof Gloves');
        }
        if (sunny) add(W, 'Sunglasses & Sun Hat');
        if (w.isVeryHot) add(W, 'Cooling Towel or Neck Gaiter?', `Highs up to ${w.maxTemp}°F`);
        if (w.isWindy) add(W, 'Windbreaker', 'Windy conditions expected');
        add(W, 'Light Hoodie or Layer', 'Versatile outerwear');

        // Activities (personal gear only; shared gear is on the Family Gear list)
        if (has('hike')) {
          add(A, 'Hiking Shoes');
          add(A, 'Small Backpack');
          add(A, 'Water Bottle');
          add(A, 'Trail Snacks');
          if (w.isHot) add(A, 'Extra Water Bottle', `Highs up to ${w.maxTemp}°F`);
          if (w.hasSnow || w.isFreezing) add(A, 'Traction Spikes for Shoes?', 'Icy or snowy trails possible');
        }
        if (has('biking')) {
          add(A, 'Bike Helmet');
          add(A, 'Bike Gloves');
          add(A, 'Diaper Pants', 'Mountain biking padded underwear');
        }
        if (has('swimming')) {
          add(A, 'Swimsuit');
          add(A, 'Swim Towel');
          add(A, 'Water Shoes or Sandals');
          add(A, 'Swim Goggles');
          if (cold) {
            add(A, 'Warm Layer for After Swimming', 'Chilly temps expected');
            add(A, 'Rash Guard or Wetsuit?');
          }
        }
        if (camping) {
          add(A, 'Sleeping Bag & Pad', w.minTemp != null ? `Make sure it's rated for ${w.minTemp}°F or colder` : undefined);
          add(A, 'Headlamp');
          add(A, 'Camp Pillow');
          add(A, 'Camp Shoes');
        }
        if (has('motocamping')) {
          add(A, 'Helmet & Comms');
          add(A, 'Riding Jacket & Pants');
          add(A, 'Riding Boots & Gloves');
          if (rain) add(A, 'Rain Gear / Liners for Riding');
          if (cold) add(A, 'Warm Riding Gloves & Neck Gaiter', lowNote);
        }
        if (has('sightseeing')) {
          add(A, 'Walking Shoes');
          add(A, 'Small Backpack');
        }

        // Personal care
        add(T, 'Toothbrush');
        add(T, 'Hairbrush');
        add(T, 'Personal Medications');
        if (cold || w.isWindy || sunny) add(T, 'Lip Balm (with SPF)');
        if (profile.gender === 'female' && age >= 10) add(T, 'Feminine Hygiene Products');

        // Kid-friendly extras instead of adult logistics
        add(G, 'Water Bottle');
        add(G, 'Book, Cards or Small Toys for Downtime');
        if (age <= 8) add(G, 'Comfort Item / Stuffy?');
        if (age < 10) add(G, 'Card with Parent Names & Phone #', 'In a pocket or backpack');
      }

      // Items this person keeps for an activity (or every trip)
      saved.forEach(s => {
        if (s.activity !== 'always' && !has(s.activity)) return;
        const savedInfo = {savedId: s.id, savedFor: s.activity};
        // If the engine already added the same item, just mark it as saved
        for (const list of Object.values(cats)) {
          const match = list.find(i => i.text.toLowerCase() === s.text.toLowerCase());
          if (match) {
            Object.assign(match, savedInfo);
            return;
          }
        }
        add(s.category, s.text, undefined, {id: s.id, ...savedInfo});
      });

      return cats;
    };

    // Read a saved value from this device, falling back if it's missing or unreadable
    const loadStored = (key, fallback) => {
      try {
        const v = JSON.parse(localStorage.getItem(key));
        return v ?? fallback;
      } catch (e) {
        return fallback;
      }
    };

    function App() {
      // --- FORM STATE (kept on this device so a reload doesn't lose the trip) ---
      const storedForm = useMemo(() => loadStored('pocketpath_form', {}), []);
      const [startDate, setStartDate] = useState(() => storedForm.startDate || localToday());

      // Each stop: {id, name, lat, lon, nights}
      const [locations, setLocations] = useState(() => (Array.isArray(storedForm.locations) ? storedForm.locations : []));

      const [personId, setPersonId] = useState(FAMILY[0].id);
      const person = PROFILES.find(p => p.id === personId) || FAMILY[0];

      const selectPerson = (p) => setPersonId(p.id);

      // --- KID PHOTOS (saved on this device) ---
      const [photos, setPhotos] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('pocketpath_photos')) || {};
        } catch (e) {
          return {};
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('pocketpath_photos', JSON.stringify(photos));
        } catch (e) {
          console.error('Could not save photos', e);
        }
      }, [photos]);

      // Crop to a square and shrink to 256px so photos stay small enough to store
      const handlePhotoUpload = (pid, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const side = Math.min(img.width, img.height);
            canvas.getContext('2d').drawImage(
              img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size
            );
            setPhotos(prev => ({...prev, [pid]: canvas.toDataURL('image/jpeg', 0.85)}));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      };
      const [selectedActivities, setSelectedActivities] = useState(() =>
        Array.isArray(storedForm.activities) ? storedForm.activities : ['hike', 'camping']
      );

      useEffect(() => {
        try {
          localStorage.setItem('pocketpath_form', JSON.stringify({startDate, locations, activities: selectedActivities}));
        } catch (e) {
          console.error('Could not save trip details', e);
        }
      }, [startDate, locations, selectedActivities]);

      // --- WEATHER & LIST STATE ---
      // Lists, check marks, and saved items are kept on this device between visits
      const [weatherData, setWeatherData] = useState(() => loadStored('pocketpath_weather', []));
      const [loadingWeather, setLoadingWeather] = useState(false);
      const [lists, setLists] = useState(() => loadStored('pocketpath_lists', null)); // {profileId: {category: [items]}}
      const [checkedItems, setCheckedItems] = useState(() => loadStored('pocketpath_checked', {})); // {profileId: {itemId: true}}
      const [savedItems, setSavedItems] = useState(() => loadStored('pocketpath_saved_items', {})); // {profileId: [{id, text, category, activity}]}
      // The trip the current lists were generated for: {startDate, locations, activities}
      const [listTrip, setListTrip] = useState(() => loadStored('pocketpath_list_trip', null));
      const [newItemText, setNewItemText] = useState({});
      const [savingItemId, setSavingItemId] = useState(null);
      const [copiedNotification, setCopiedNotification] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('pocketpath_lists', JSON.stringify(lists));
          localStorage.setItem('pocketpath_checked', JSON.stringify(checkedItems));
          localStorage.setItem('pocketpath_saved_items', JSON.stringify(savedItems));
          localStorage.setItem('pocketpath_weather', JSON.stringify(weatherData));
          localStorage.setItem('pocketpath_list_trip', JSON.stringify(listTrip));
        } catch (e) {
          console.error('Could not save lists', e);
        }
      }, [lists, checkedItems, savedItems, weatherData, listTrip]);

      // Details of the trip the lists belong to (older saved lists fall back to the form)
      const tripForLists = listTrip || {startDate, locations, activities: selectedActivities};
      const tripNights = tripForLists.locations.reduce((s, l) => s + (parseInt(l.nights, 10) || 0), 0);

      const activeLocations = locations;

      const totalNights = useMemo(() => {
        return activeLocations.reduce((sum, loc) => sum + (parseInt(loc.nights, 10) || 0), 0);
      }, [activeLocations]);

      // A trip with N nights spans N + 1 days
      const totalTripDays = totalNights + 1;

      const addLocation = (loc) => setLocations(prev => [...prev, loc]);
      const removeLocation = (id) => setLocations(prev => prev.filter(l => l.id !== id));
      const changeNights = (id, delta) => setLocations(prev => prev.map(l =>
        l.id === id ? {...l, nights: Math.min(60, Math.max(0, l.nights + delta))} : l
      ));

      const toggleActivity = (actId) => {
        setSelectedActivities(prev =>
          prev.includes(actId) ? prev.filter(id => id !== actId) : [...prev, actId]
        );
      };

      // --- EDITING THE CURRENT PERSON'S LIST ---
      const currentList = lists ? (lists[personId] || {}) : null;

      const updateCurrentList = (fn) => {
        setLists(prev => ({...prev, [personId]: fn(prev[personId] || {})}));
      };

      const handleDeleteItem = (catName, itemId) => {
        updateCurrentList(list => ({...list, [catName]: list[catName].filter(item => item.id !== itemId)}));
      };

      const handleAddItem = (catName) => {
        const text = newItemText[catName]?.trim();
        if (!text) return;
        const newItem = {id: `custom_${Date.now()}`, text, custom: true};
        updateCurrentList(list => ({...list, [catName]: [...(list[catName] || []), newItem]}));
        setNewItemText(prev => ({...prev, [catName]: ''}));
      };

      // Keep an item on this person's permanent list for an activity (or every trip)
      const saveItem = (catName, item, activity) => {
        const saved = {id: `saved_${Date.now()}`, text: item.text, category: catName, activity};
        setSavedItems(prev => ({...prev, [personId]: [...(prev[personId] || []), saved]}));
        updateCurrentList(list => ({
          ...list,
          [catName]: list[catName].map(i => (i.id === item.id ? {...i, savedId: saved.id, savedFor: activity} : i))
        }));
        setSavingItemId(null);
      };

      const unsaveItem = (catName, item) => {
        setSavedItems(prev => ({...prev, [personId]: (prev[personId] || []).filter(s => s.id !== item.savedId)}));
        updateCurrentList(list => ({
          ...list,
          [catName]: list[catName].map(i => (i.id === item.id ? {...i, savedId: undefined, savedFor: undefined} : i))
        }));
      };

      // --- GENERATE LISTS FOR EVERYONE ---
      const generatePackingList = async () => {
        if (activeLocations.length === 0) {
          alert('Add at least one destination using the map.');
          return;
        }
        setLoadingWeather(true);

        // Work out the dates you'll be at each stop, in order
        let offset = 0;
        const stopDates = activeLocations.map(loc => {
          const from = addDays(startDate, offset);
          const to = addDays(startDate, offset + Math.max(0, loc.nights));
          offset += Math.max(0, loc.nights);
          return {loc, from, to};
        });

        const stopWeather = await Promise.all(stopDates.map(({loc, from, to}) => fetchStopWeather(loc, from, to)));
        setWeatherData(stopWeather);
        const w = summarizeWeather(stopWeather);

        const days = Math.max(1, totalTripDays);
        const newLists = {};
        PROFILES.forEach(p => {
          const list = buildPackingList(p, {days, activities: selectedActivities, w, saved: savedItems[p.id] || []});
          // Carry over items you added by hand for this trip (unless the new list already has them)
          const old = lists?.[p.id] || {};
          Object.entries(old).forEach(([cat, items]) => {
            items.filter(i => i.custom && !i.savedId).forEach(i => {
              const dup = Object.values(list).some(l => l.some(x => x.text.toLowerCase() === i.text.toLowerCase()));
              if (!dup) list[cat] = [...(list[cat] || []), i];
            });
          });
          newLists[p.id] = list;
        });
        // Keep checkmarks for items that are still on the new lists
        setCheckedItems(prev => {
          const next = {};
          Object.entries(newLists).forEach(([pid, list]) => {
            const ids = new Set(Object.values(list).flat().map(i => i.id));
            Object.keys(prev[pid] || {}).forEach(id => {
              if (prev[pid][id] && ids.has(id)) (next[pid] = next[pid] || {})[id] = true;
            });
          });
          return next;
        });
        setLists(newLists);
        setListTrip({startDate, locations: activeLocations, activities: selectedActivities});
        setLoadingWeather(false);

        setTimeout(() => {
          document.getElementById('packing-results-section')?.scrollIntoView({behavior: 'smooth'});
        }, 150);
      };

      const toggleCheck = (itemId) => {
        setCheckedItems(prev => ({
          ...prev,
          [personId]: {...(prev[personId] || {}), [itemId]: !(prev[personId] || {})[itemId]}
        }));
      };

      // Progress for any profile (used on the name tabs and the progress bar)
      const progressFor = (pid) => {
        const list = lists?.[pid] || {};
        const ids = Object.values(list).flat().map(i => i.id);
        const checked = ids.filter(id => checkedItems[pid]?.[id]).length;
        return {total: ids.length, checked, pct: ids.length ? Math.round((checked / ids.length) * 100) : 0};
      };
      const progress = progressFor(personId);
      const weatherSummary = useMemo(() => summarizeWeather(weatherData), [weatherData]);

      const copyToClipboard = () => {
        if (!currentList) return;
        let textOutput = `🏕️ ${person.name.toUpperCase()}'S PACKING LIST\nTrip: ${tripNights} night${tripNights === 1 ? '' : 's'} starting ${shortDate(tripForLists.startDate)}\nStops: ${tripForLists.locations.map(l => `${l.name} (${l.nights}n)`).join(', ')}\n\n`;
        Object.keys(currentList).forEach(cat => {
          if (!currentList[cat].length) return;
          textOutput += `=== ${cat.toUpperCase()} ===\n`;
          currentList[cat].forEach(item => {
            const isChecked = checkedItems[personId]?.[item.id] ? '[x]' : '[ ]';
            textOutput += `${isChecked} ${item.text}${item.note ? ` (${item.note})` : ''}\n`;
          });
          textOutput += `\n`;
        });
        navigator.clipboard.writeText(textOutput);
        setCopiedNotification(true);
        setTimeout(() => setCopiedNotification(false), 2500);
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 font-sans pb-16">
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">

                <img
                  src="PocketPath.png"
                  alt="PocketPath Logo"
                  className="h-10 w-10 object-contain rounded-xl"
                />
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    PocketPath <span className="text-emerald-400 font-normal text-sm px-2 py-0.5 rounded-full bg-emerald-950/80 border border-emerald-800/50">Pack AI</span>
                  </h1>
                  <p className="text-xs text-slate-400">Smart Adventure Planning & Gear Generator</p>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 sm:px-6 pt-8 space-y-10">
            <div className="text-center max-w-2xl mx-auto space-y-3">
              <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
                Plan your expedition, <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-300">pack with precision.</span>
              </h2>
              <p className="text-slate-400 text-sm sm:text-base leading-relaxed">
                Enter your destination, profile, and outdoor activities. We compute weather forecasts and smart garment reutilization to give you the exact packing list.
              </p>
            </div>

            <section className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 sm:p-8 shadow-xl space-y-8">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-7 space-y-6">
                  <div className="flex items-center gap-2 border-b border-slate-700/80 pb-3">
                    <Icon name="MapPin" className="w-5 h-5 text-emerald-400" />
                    <h3 className="font-semibold text-lg text-white">1. Trip Dates & Destinations</h3>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                      Trip Start Date
                    </label>
                    <input
                      type="date"
                      value={startDate}
                      onChange={(e) => setStartDate(e.target.value)}
                      className="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400">
                        Destinations & Nights
                      </label>
                      {locations.length > 0 && (
                        <span className="text-xs text-slate-400">{totalNights} night{totalNights === 1 ? '' : 's'} total</span>
                      )}
                    </div>

                    <MapPicker locations={locations} onAdd={addLocation} />

                    {locations.length === 0 ? (
                      <p className="text-sm text-slate-500 italic">No stops yet. Search or drop a pin to add your first destination.</p>
                    ) : (
                      <ol className="space-y-2">
                        {locations.map((loc, idx) => (
                          <li key={loc.id} className="flex items-center gap-3 bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2">
                            <span className="w-7 h-7 shrink-0 rounded-full bg-emerald-500 text-slate-950 text-xs font-extrabold flex items-center justify-center">{idx + 1}</span>
                            <span className="flex-1 text-sm text-slate-100 truncate">{loc.name}</span>
                            <div className="flex items-center gap-1.5 shrink-0">
                              <button type="button" onClick={() => changeNights(loc.id, -1)} className="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 leading-none">−</button>
                              <span className="w-14 text-center text-xs text-slate-300"><b className="text-emerald-300 text-sm">{loc.nights}</b> night{loc.nights === 1 ? '' : 's'}</span>
                              <button type="button" onClick={() => changeNights(loc.id, 1)} className="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 leading-none">+</button>
                            </div>
                            <button type="button" onClick={() => removeLocation(loc.id)} title="Remove stop" className="p-1.5 text-slate-500 hover:text-red-400">
                              <Icon name="X" className="w-4 h-4" />
                            </button>
                          </li>
                        ))}
                      </ol>
                    )}
                  </div>
                </div>

                <div className="lg:col-span-5 space-y-6">
                  <div className="flex items-center gap-2 border-b border-slate-700/80 pb-3">
                    <Icon name="User" className="w-5 h-5 text-emerald-400" />
                    <h3 className="font-semibold text-lg text-white">2. Traveler Profile</h3>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                      Who's Packing?
                    </label>
                    <p className="text-xs text-slate-500 -mt-1 mb-3">Lists are made for everyone at once. Tap a name to see theirs.</p>
                    <div className="grid grid-cols-4 gap-2">
                      {PROFILES.map(p => {
                        const isSelected = personId === p.id;
                        return (
                          <div key={p.id} className="relative">
                            <button
                              type="button"
                              onClick={() => selectPerson(p)}
                              className={`w-full flex flex-col items-center gap-2 py-3 px-2 rounded-xl border transition-all ${isSelected
                                ? 'bg-emerald-500/20 border-emerald-500'
                                : 'bg-slate-900/60 border-slate-700'
                                }`}
                            >
                              <div className={`w-12 h-12 sm:w-16 sm:h-16 rounded-full overflow-hidden bg-slate-800 flex items-center justify-center text-2xl font-bold text-slate-300 ${isSelected ? 'ring-2 ring-emerald-400' : ''}`}>
                                {p.shared
                                  ? <Icon name="Users" className="w-7 h-7" />
                                  : photos[p.id]
                                    ? <img src={photos[p.id]} alt={p.name} className="w-full h-full object-cover" />
                                    : p.name[0]}
                              </div>
                              <span className={`text-sm font-semibold ${isSelected ? 'text-emerald-300' : 'text-slate-300'}`}>{p.name}</span>
                            </button>
                            {!p.shared && <label
                              title={`${photos[p.id] ? 'Change' : 'Add'} ${p.name}'s photo`}
                              className="absolute top-1.5 right-1.5 p-1.5 rounded-full bg-slate-900/90 border border-slate-600 text-slate-300 cursor-pointer hover:text-emerald-300"
                            >
                              <Icon name="Camera" className="w-3.5 h-3.5" />
                              <input
                                type="file"
                                accept="image/*"
                                className="hidden"
                                onChange={(e) => {
                                  handlePhotoUpload(p.id, e.target.files[0]);
                                  e.target.value = '';
                                }}
                              />
                            </label>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>

              <div className="space-y-4 pt-4 border-t border-slate-700/80">
                <div className="flex items-center gap-2">
                  <Icon name="Layers" className="w-5 h-5 text-emerald-400" />
                  <h3 className="font-semibold text-lg text-white">3. Planned Adventure Activities</h3>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  {AVAILABLE_ACTIVITIES.map(act => {
                    const isSelected = selectedActivities.includes(act.id);
                    return (
                      <button
                        key={act.id}
                        type="button"
                        onClick={() => toggleActivity(act.id)}
                        className={`flex items-start gap-3 p-3.5 rounded-xl border text-left transition-all ${isSelected
                          ? 'bg-emerald-950/40 border-emerald-500/80 ring-1 ring-emerald-500/50'
                          : 'bg-slate-900/60 border-slate-700/80'
                          }`}
                      >
                        <div className={`p-2 rounded-lg shrink-0 ${isSelected ? 'bg-emerald-500 text-slate-900' : 'bg-slate-800 text-slate-400'}`}>
                          <Icon name={act.iconName} fallback={act.fallbackIcon} className="w-5 h-5" />
                        </div>
                        <div>
                          <span className={`text-sm font-semibold ${isSelected ? 'text-emerald-300' : 'text-slate-200'}`}>
                            {act.name}
                          </span>
                          <p className="text-xs text-slate-400 mt-0.5">{act.desc}</p>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="pt-2">
                <button
                  type="button"
                  onClick={generatePackingList}
                  disabled={loadingWeather}
                  className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base transition-all active:scale-[0.99] disabled:opacity-50"
                >
                  <Icon name="Sparkles" className="w-5 h-5" />
                  {loadingWeather ? "Checking the weather..." : "Generate Packing Lists for Everyone"}
                </button>
              </div>
            </section>

            {weatherData.length > 0 && (
              <section className="space-y-3">
                <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <Icon name="Sun" className="w-4 h-4 text-amber-400" /> Weather For Your Trip Dates
                </h3>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {weatherData.map((data, idx) => (
                    <div key={idx} className={`bg-slate-800/80 border rounded-xl p-4 space-y-2 ${data.source === 'unavailable' ? 'border-amber-600/70' : 'border-slate-700/80'}`}>
                      <div className="flex items-start justify-between gap-2">
                        <h4 className="font-bold text-white text-sm truncate">{idx + 1}. {data.displayName}</h4>
                        <span className="text-[11px] text-slate-400 shrink-0">
                          {shortDate(data.from)}{data.to !== data.from ? ` – ${shortDate(data.to)}` : ''}
                        </span>
                      </div>
                      {data.source === 'unavailable' ? (
                        <p className="text-xs text-amber-300">Couldn't load weather here, so rain and cold gear were added just in case.</p>
                      ) : (
                        <>
                          <div className="flex items-baseline justify-between pt-1">
                            <span className="text-lg font-bold text-slate-100">{data.minTemp}° – {data.maxTemp}°F</span>
                            <span className="text-xs font-semibold text-slate-400">{data.rainChance}% rain</span>
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            {data.hasSnow && <span className="text-[11px] px-2 py-0.5 rounded-full bg-sky-900/60 text-sky-200">Snow possible</span>}
                            {data.maxWind >= 25 && <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-700 text-slate-200">Windy · {data.maxWind} mph</span>}
                            {data.minTemp <= 32 && <span className="text-[11px] px-2 py-0.5 rounded-full bg-indigo-900/60 text-indigo-200">Freezing nights</span>}
                          </div>
                          <p className="text-[11px] text-slate-500">
                            {data.source === 'forecast' ? 'Live forecast' : `Typical weather for these dates (last ${data.years} years). Live forecast shows up about 2 weeks out.`}
                          </p>
                        </>
                      )}
                    </div>
                  ))}
                </div>
              </section>
            )}

            {lists && (
              <section id="packing-results-section" className="space-y-6 pt-4 border-t border-slate-800">
                {/* Name tabs: tap a name to switch whose list you see */}
                <div className="grid grid-cols-4 gap-2">
                  {PROFILES.map(p => {
                    const pr = progressFor(p.id);
                    const isSelected = personId === p.id;
                    return (
                      <button
                        key={p.id}
                        type="button"
                        onClick={() => { setPersonId(p.id); setSavingItemId(null); }}
                        className={`flex flex-col items-center gap-1 py-2 px-1 rounded-xl border transition-all ${isSelected ? 'bg-emerald-500/20 border-emerald-500' : 'bg-slate-800/60 border-slate-700'}`}
                      >
                        <div className="w-10 h-10 rounded-full overflow-hidden bg-slate-700 flex items-center justify-center text-base font-bold text-slate-200">
                          {p.shared
                            ? <Icon name="Users" className="w-5 h-5" />
                            : photos[p.id] ? <img src={photos[p.id]} alt={p.name} className="w-full h-full object-cover" /> : p.name[0]}
                        </div>
                        <span className={`text-xs font-semibold ${isSelected ? 'text-emerald-300' : 'text-slate-300'}`}>{p.name}</span>
                        <span className="text-[10px] text-slate-500">{pr.checked}/{pr.total}</span>
                      </button>
                    );
                  })}
                </div>

                <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 sm:p-6 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <h3 className="text-xl font-bold text-white flex items-center gap-2">
                      <Icon name="ShoppingBag" className="w-5 h-5 text-emerald-400" />
                      {person.shared ? 'Family Gear (shared)' : `${person.name}'s Packing List`}
                    </h3>
                    <button
                      onClick={copyToClipboard}
                      className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5"
                    >
                      <Icon name="Copy" className="w-4 h-4" />
                      {copiedNotification ? 'Copied!' : 'Copy List'}
                    </button>
                  </div>

                  {weatherSummary.missing.length > 0 && (
                    <p className="text-xs text-amber-300 bg-amber-950/40 border border-amber-800/60 rounded-lg px-3 py-2">
                      Weather couldn't load for {weatherSummary.missing.join(', ')}, so rain and cold-weather gear were added just in case.
                    </p>
                  )}

                  <div className="space-y-1.5 pt-2">
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-slate-400 font-medium">Packing Progress</span>
                      <span className="font-bold text-emerald-400">{progress.checked} of {progress.total} items packed ({progress.pct}%)</span>
                    </div>
                    <div className="w-full bg-slate-900 rounded-full h-3 p-0.5 border border-slate-700">
                      <div className="bg-emerald-500 h-full rounded-full transition-all duration-300" style={{width: `${progress.pct}%`}} />
                    </div>
                  </div>
                </div>

                <div className="space-y-6">
                  {CATEGORY_ORDER.concat(Object.keys(currentList || {}).filter(c => !CATEGORY_ORDER.includes(c))).map(catName => {
                    const allItems = currentList?.[catName] || [];
                    if (allItems.length === 0 && person.shared && catName === 'Clothing & Apparel') return null;

                    return (
                      <div key={catName} className="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-5 space-y-4">
                        <h4 className="font-bold text-slate-200 text-base">{catName}</h4>

                        <div className="grid grid-cols-1 gap-2.5">
                          {allItems.map(item => {
                            const isChecked = !!checkedItems[personId]?.[item.id];
                            const canSave = item.custom || item.savedId;
                            return (
                              <div key={item.id} className="space-y-2">
                                <div
                                  className={`flex items-center justify-between gap-3 p-3 rounded-xl border ${isChecked
                                    ? 'bg-slate-900/40 border-slate-800 text-slate-500'
                                    : 'bg-slate-900/80 border-slate-700 text-slate-200'
                                    }`}
                                >
                                  <div onClick={() => toggleCheck(item.id)} className="flex-1 cursor-pointer flex items-start gap-3">
                                    <span className={`mt-0.5 w-5 h-5 shrink-0 rounded-md border flex items-center justify-center ${isChecked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-500'}`}>
                                      {isChecked && <Icon name="Check" className="w-3.5 h-3.5" />}
                                    </span>
                                    <span>
                                      <span className={`text-sm font-medium ${isChecked ? 'line-through' : ''}`}>{item.text}</span>
                                      {item.savedId && (
                                        <span className="block text-[11px] text-emerald-400">Saved for {activityName(item.savedFor)}</span>
                                      )}
                                      {item.note && !item.savedId && (
                                        <span className="block text-[11px] text-slate-500">{item.note}</span>
                                      )}
                                    </span>
                                  </div>

                                  {canSave && (
                                    <button
                                      type="button"
                                      onClick={() => (item.savedId ? unsaveItem(catName, item) : setSavingItemId(savingItemId === item.id ? null : item.id))}
                                      className={`p-1 transition-colors ${item.savedId ? 'text-emerald-400 hover:text-slate-400' : 'text-slate-500 hover:text-emerald-400'}`}
                                      title={item.savedId ? 'Remove from saved items' : `Always pack this for ${person.name}`}
                                    >
                                      <Icon name={item.savedId ? 'BookmarkCheck' : 'BookmarkPlus'} className="w-4 h-4" />
                                    </button>
                                  )}

                                  <button
                                    type="button"
                                    onClick={() => handleDeleteItem(catName, item.id)}
                                    className="text-slate-500 hover:text-red-400 p-1 transition-colors"
                                    title="Remove from this trip"
                                  >
                                    <Icon name="Trash2" className="w-4 h-4" />
                                  </button>
                                </div>

                                {savingItemId === item.id && (
                                  <div className="ml-3 p-3 rounded-xl bg-slate-900 border border-emerald-700/60 space-y-2">
                                    <p className="text-xs text-slate-300">
                                      Always add "<b>{item.text}</b>" to {person.shared ? 'Family Gear' : `${person.name}'s list`} for:
                                    </p>
                                    <div className="flex flex-wrap gap-2">
                                      {['always', ...tripForLists.activities].map(act => (
                                        <button
                                          key={act}
                                          type="button"
                                          onClick={() => saveItem(catName, item, act)}
                                          className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500/20 border border-emerald-600 text-emerald-300 hover:bg-emerald-500/30"
                                        >
                                          {activityName(act)}
                                        </button>
                                      ))}
                                      <button type="button" onClick={() => setSavingItemId(null)} className="px-3 py-1.5 rounded-lg text-xs text-slate-400 border border-slate-700">
                                        Cancel
                                      </button>
                                    </div>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                          {allItems.length === 0 && <p className="text-xs text-slate-500 italic">Nothing here yet.</p>}
                        </div>

                        <div className="flex gap-2 pt-2">
                          <input
                            type="text"
                            placeholder={`+ Add item to ${catName}...`}
                            value={newItemText[catName] || ''}
                            onChange={(e) => setNewItemText({...newItemText, [catName]: e.target.value})}
                            onKeyDown={(e) => e.key === 'Enter' && handleAddItem(catName)}
                            className="flex-1 bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                          />
                          <button
                            type="button"
                            onClick={() => handleAddItem(catName)}
                            className="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs"
                          >
                            Add
                          </button>
                        </div>
                        {catName === CATEGORY_ORDER[0] && (
                          <p className="text-[11px] text-slate-500 -mt-1">Tip: after adding an item, tap the bookmark to always pack it for {person.shared ? 'the family' : person.name}.</p>
                        )}
                      </div>
                    );
                  })}
                </div>
              </section>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
