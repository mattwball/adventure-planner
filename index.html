<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketPath - Adventure Planning & Packing List</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for parsing React/JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const {useState, useEffect, useMemo} = React;

    // Helper Component for Lucide Icons
    const Icon = ({name, className = "w-5 h-5"}) => {
      const iconRef = React.useRef(null);

      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = '';
          const iconNode = window.lucide.createElement(window.lucide.icons[name] || window.lucide.icons.HelpCircle);
          iconRef.current.appendChild(iconNode);
          if (className) {
            const svg = iconRef.current.querySelector('svg');
            if (svg) svg.setAttribute('class', className);
          }
        }
      }, [name, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center" />;
    };

    // --- ACTIVITIES DEFINITION ---
    const AVAILABLE_ACTIVITIES = [
      {id: 'hike', name: 'Hiking', iconName: 'Mountain', desc: 'Trails, elevation, and nature walks'},
      {id: 'biking', name: 'Mountain Biking', iconName: 'Bike', desc: 'Singletrack, dirt roads, or trails'},
      {id: 'swimming', name: 'Swimming', iconName: 'Waves', desc: 'Lakes, oceans, or pools'},
      {id: 'camping', name: 'Camping', iconName: 'Tent', desc: 'Overnight tent or wilderness stay'},
      {id: 'trailrunning', name: 'Trail Running', iconName: 'Footprints', desc: 'Off-road running & rugged terrain'},
      {id: 'sightseeing', name: 'Sightseeing', iconName: 'Camera', desc: 'Town exploration, light walking'},
    ];

    function App() {
      // --- FORM STATE ---
      const [startDate, setStartDate] = useState(() => {
        const today = new Date();
        return today.toISOString().split('T')[0];
      });

      const [locations, setLocations] = useState([
        {id: '1', name: 'Yosemite National Park', days: 3},
        {id: '2', name: '', days: 2},
        {id: '3', name: '', days: 1}
      ]);

      const [gender, setGender] = useState('male');
      const [age, setAge] = useState(28);
      const [selectedActivities, setSelectedActivities] = useState(['hike', 'camping']);

      // --- WEATHER & UI STATE ---
      const [weatherData, setWeatherData] = useState({});
      const [loadingWeather, setLoadingWeather] = useState(false);
      const [generatedList, setGeneratedList] = useState(null);
      const [checkedItems, setCheckedItems] = useState({});
      const [customItems, setCustomItems] = useState({});
      const [newItemText, setNewItemText] = useState({});
      const [activeCategoryFilter, setActiveCategoryFilter] = useState('All');
      const [copiedNotification, setCopiedNotification] = useState(false);

      const activeLocations = useMemo(() => {
        return locations.filter(loc => loc.name.trim().length > 0);
      }, [locations]);

      const totalTripDays = useMemo(() => {
        return activeLocations.reduce((sum, loc) => sum + (parseInt(loc.days, 10) || 1), 0);
      }, [activeLocations]);

      const handleLocationChange = (index, field, value) => {
        const newLocs = [...locations];
        newLocs[index][field] = value;
        setLocations(newLocs);
      };

      const toggleActivity = (actId) => {
        setSelectedActivities(prev =>
          prev.includes(actId) ? prev.filter(id => id !== actId) : [...prev, actId]
        );
      };

      // --- OPEN-METEO WEATHER API ---
      const fetchWeatherForLocations = async () => {
        setLoadingWeather(true);
        const results = {};

        for (const loc of activeLocations) {
          if (!loc.name.trim()) continue;

          try {
            const geoRes = await fetch(
              `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(loc.name)}&count=1&language=en&format=json`
            );
            const geoData = await geoRes.json();

            if (geoData.results && geoData.results.length > 0) {
              const {latitude, longitude, name, admin1} = geoData.results[0];

              const weatherRes = await fetch(
                `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&temperature_unit=fahrenheit&forecast_days=7`
              );
              const wData = await weatherRes.json();

              if (wData.daily) {
                const maxTemp = Math.round(Math.max(...wData.daily.temperature_2m_max));
                const minTemp = Math.round(Math.min(...wData.daily.temperature_2m_min));
                const maxRainProb = Math.max(...wData.daily.precipitation_probability_max);

                results[loc.id] = {
                  displayName: `${name}${admin1 ? `, ${admin1}` : ''}`,
                  maxTemp,
                  minTemp,
                  rainChance: maxRainProb,
                  hasRain: maxRainProb > 35,
                  isCold: minTemp < 50,
                  isHot: maxTemp > 78,
                  isFallback: false
                };
              } else {
                throw new Error('No weather metrics returned');
              }
            } else {
              throw new Error('Location not found');
            }
          } catch (err) {
            results[loc.id] = {
              displayName: loc.name,
              maxTemp: 72,
              minTemp: 48,
              rainChance: 25,
              hasRain: false,
              isCold: false,
              isHot: false,
              isFallback: true
            };
          }
        }

        setWeatherData(results);
        setLoadingWeather(false);
        return results;
      };

      // --- GENERATE PACKING LIST ENGINE ---
      const generatePackingList = async () => {
        if (activeLocations.length === 0) {
          alert('Please add at least one valid location name.');
          return;
        }

        const wResults = await fetchWeatherForLocations();

        let overallHasRain = false;
        let overallIsCold = false;
        let overallIsHot = false;

        Object.values(wResults).forEach(w => {
          if (w.hasRain) overallHasRain = true;
          if (w.isCold) overallIsCold = true;
          if (w.isHot) overallIsHot = true;
        });

        const days = Math.max(1, totalTripDays);
        const travelerAge = Number(age) || 28;

        const shirtsCount = Math.max(2, Math.ceil(days / 1.5));
        const pantsCount = Math.max(1, Math.ceil(days / 2.5));
        const underwearCount = days + 1;
        const socksCount = days + 1;

        const categories = {
          'Clothing & Apparel': [],
          'Activity Gear': [],
          'Weather & Climate Essentials': [],
          'Toiletries & Personal Care': [],
          'General & Logistics': []
        };

        const isFemale = gender === 'female';

        categories['Clothing & Apparel'].push(
  { id: 'c1', text: `${shirtsCount}x Shirts` },
  { id: 'c2', text: `${pantsCount}x Pants / Shorts` },
  { id: 'c3', text: `${underwearCount}x ${isFemale ? 'Underwear & Bras' : 'Underwear'}` },
  { id: 'c4', text: `${socksCount}x Socks` },
  { id: 'c5', text: `1x Sleepwear` }
);
        if (travelerAge < 12) {
          categories['Clothing & Apparel'].push({id: 'c6', text: '2x Extra Change of Clothes (Youth Backup)'});
        }

        if (overallHasRain) {
          categories['Weather & Climate Essentials'].push(
            {id: 'w1', text: 'Rain Jacket'},
            {id: 'w2', text: 'Waterproof/Dry Bags'}
          );
        }

        if (overallIsCold) {
          categories['Weather & Climate Essentials'].push(
            {id: 'w3', text: 'Warm Jacket', note: 'Lows expected under 50°F / 10°C'},
            {id: 'w4', text: 'Warm Base Layer?', note: 'For chilly mornings/nights'},
            {id: 'w5', text: 'Beanie & Gloves'}
          );
        }

        if (overallIsHot || selectedActivities.includes('swimming') || selectedActivities.includes('hike')) {
          categories['Weather & Climate Essentials'].push(
            {id: 'w6', text: 'Sun defence', note: 'Sunglasses & Hat?'},
            {id: 'w7', text: 'Sunscreen'}
          );
        }

        categories['Weather & Climate Essentials'].push({id: 'w8', text: 'Light Windbreaker or Layering Hoodie', note: 'Versatile outerwear'});

        if (selectedActivities.includes('hike')) {
          categories['Activity Gear'].push(
            {id: 'a_h1', text: 'Hiking Shoes'},
            {id: 'a_h2', text: 'BackPack'},
            {id: 'a_h3', text: 'Water Bottles'},
            {id: 'a_h4', text: 'Trail Snacks'}
          );
          if (travelerAge > 50) {
            categories['Activity Gear'].push({id: 'a_h5', text: 'Trekking Poles?'});
          }
        }

        if (selectedActivities.includes('biking')) {
          categories['Activity Gear'].push(
            {id: 'a_b1', text: 'Helmet'},
            {id: 'a_b2', text: 'Diaper Pants', note: 'mountain biking padded underware'},
            {id: 'a_b3', text: 'Gloves and Sunglasses'},
            {id: 'a_b4', text: 'Pump and tools'}
          );
        }

        if (selectedActivities.includes('swimming')) {
          categories['Activity Gear'].push(
            {id: 'a_s1', text: `Swimsuit`},
            {id: 'a_s2', text: 'Swim Towels'},
            {id: 'a_s3', text: 'Water Shoes or Sandals'},
            {id: 'a_s4', text: 'Swim Goggles'}
          );
        }

        if (selectedActivities.includes('camping')) {
          categories['Activity Gear'].push(
            {id: 'a_c1', text: 'Tent'},
            {id: 'a_c2', text: 'Sleeping Bag & Pad'},
            {id: 'a_c3', text: 'Headlamp'},
            {id: 'a_c4', text: 'Camp Stove, Fuel & stuff to eat with'}
          );
        }

        if (selectedActivities.includes('trailrunning')) {
          categories['Activity Gear'].push(
            {id: 'a_tr1', text: 'Trail Running Shoes'},
            {id: 'a_tr2', text: 'Hydration Vest'},
            {id: 'a_tr3', text: 'Anti-Chafing Body Glide'}
          );
        }

        if (selectedActivities.includes('sightseeing')) {
          categories['Activity Gear'].push(
            {id: 'a_sg1', text: 'Walking Shoes'},
            {id: 'a_sg2', text: 'Backpack'}
          );
        }

        categories['Toiletries & Personal Care'].push(
          {id: 't1', text: 'Toothbrush, Toothpaste & Floss'},
          {id: 't2', text: 'Soap / Bodywash'},
          {id: 't3', text: 'Insect Repellent'},
          {id: 't4', text: 'First Aid Stuff (bandaid, Ibuprofen, etc)'},
          {id: 't5', text: 'Personal Medications'}
        );

        if (isFemale) {
          categories['Toiletries & Personal Care'].push({id: 't6', text: 'Feminine Hygiene Products'});
        }

        categories['General & Logistics'].push(
          {id: 'g1', text: 'ID, Credit Cards & Cash'},
          {id: 'g2', text: 'Portable Power Bank & Charging Cables'},
          {id: 'g3', text: 'Download Offline Map'},
          {id: 'g4', text: 'Trash Bags'},
          {id: 'g5', text: 'Multi-tool and/or Pocket Knife'}
        );

        setGeneratedList(categories);
        setCheckedItems({});

        setTimeout(() => {
          document.getElementById('packing-results-section')?.scrollIntoView({behavior: 'smooth'});
        }, 150);
      };

      const toggleCheck = (itemId) => {
        setCheckedItems(prev => ({
          ...prev,
          [itemId]: !prev[itemId]
        }));
      };

      const totalItemsCount = useMemo(() => {
        if (!generatedList) return 0;
        let count = 0;
        Object.keys(generatedList).forEach(cat => {
          count += generatedList[cat].length;
          if (customItems[cat]) count += customItems[cat].length;
        });
        return count;
      }, [generatedList, customItems]);

      const checkedItemsCount = useMemo(() => {
        return Object.values(checkedItems).filter(Boolean).length;
      }, [checkedItems]);

      const packedPercentage = totalItemsCount > 0
        ? Math.round((checkedItemsCount / totalItemsCount) * 100)
        : 0;

      const copyToClipboard = () => {
        if (!generatedList) return;
        let textOutput = `🏕️ ADVENTURE PACKING LIST\nTrip Duration: ${totalTripDays} Days (${startDate})\nLocations: ${activeLocations.map(l => l.name).join(', ')}\n\n`;

        Object.keys(generatedList).forEach(cat => {
          textOutput += `=== ${cat.toUpperCase()} ===\n`;
          const allCatItems = [...generatedList[cat], ...(customItems[cat] || [])];
          allCatItems.forEach(item => {
            const isChecked = checkedItems[item.id] ? '[x]' : '[ ]';
            textOutput += `${isChecked} ${item.text} (${item.note})\n`;
          });
          textOutput += `\n`;
        });

        navigator.clipboard.writeText(textOutput);
        setCopiedNotification(true);
        setTimeout(() => setCopiedNotification(false), 2500);
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 font-sans pb-16">
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">

                <img
                  src="PocketPath.png"
                  alt="PocketPath Logo"
                  className="h-10 w-10 object-contain rounded-xl"
                />
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    PocketPath <span className="text-emerald-400 font-normal text-sm px-2 py-0.5 rounded-full bg-emerald-950/80 border border-emerald-800/50">Pack AI</span>
                  </h1>
                  <p className="text-xs text-slate-400">Smart Adventure Planning & Gear Generator</p>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 sm:px-6 pt-8 space-y-10">
            <div className="text-center max-w-2xl mx-auto space-y-3">
              <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
                Plan your expedition, <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-300">pack with precision.</span>
              </h2>
              <p className="text-slate-400 text-sm sm:text-base leading-relaxed">
                Enter your destination, profile, and outdoor activities. We compute weather forecasts and smart garment reutilization to give you the exact packing list.
              </p>
            </div>

            <section className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 sm:p-8 shadow-xl space-y-8">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-7 space-y-6">
                  <div className="flex items-center gap-2 border-b border-slate-700/80 pb-3">
                    <Icon name="MapPin" className="w-5 h-5 text-emerald-400" />
                    <h3 className="font-semibold text-lg text-white">1. Trip Dates & Destinations</h3>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                      Trip Start Date
                    </label>
                    <input
                      type="date"
                      value={startDate}
                      onChange={(e) => setStartDate(e.target.value)}
                      className="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400">
                        Destinations & Time Spent
                      </label>
                      <span className="text-xs text-slate-500">Up to 3 stops</span>
                    </div>

                    {locations.map((loc, idx) => (
                      <div key={loc.id} className="flex items-center gap-3">
                        <input
                          type="text"
                          placeholder={idx === 0 ? "e.g., Moab, Utah (Required)" : `Location ${idx + 1} (Optional)`}
                          value={loc.name}
                          onChange={(e) => handleLocationChange(idx, 'name', e.target.value)}
                          className="flex-1 bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"
                        />
                        <div className="flex items-center gap-2 bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-1.5 w-28 shrink-0">
                          <input
                            type="number"
                            min="1"
                            max="30"
                            value={loc.days}
                            onChange={(e) => handleLocationChange(idx, 'days', Math.max(1, parseInt(e.target.value, 10) || 1))}
                            className="w-10 bg-transparent text-sm text-center font-semibold text-slate-100 focus:outline-none"
                          />
                          <span className="text-xs text-slate-400">Days</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="lg:col-span-5 space-y-6">
                  <div className="flex items-center gap-2 border-b border-slate-700/80 pb-3">
                    <Icon name="User" className="w-5 h-5 text-emerald-400" />
                    <h3 className="font-semibold text-lg text-white">2. Traveler Profile</h3>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                      Gender / Fitting Style
                    </label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        {id: 'male', label: 'Male'},
                        {id: 'female', label: 'Female'},
                        {id: 'other', label: 'Unisex'}
                      ].map(g => (
                        <button
                          key={g.id}
                          type="button"
                          onClick={() => setGender(g.id)}
                          className={`py-2 px-3 rounded-xl text-xs font-medium border transition-all ${gender === g.id
                            ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300'
                            : 'bg-slate-900/60 border-slate-700 text-slate-400'
                            }`}
                        >
                          {g.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                      Traveler Age
                    </label>
                    <div className="relative">
                      <input
                        type="number"
                        min="1"
                        max="120"
                        placeholder="e.g. 28"
                        value={age}
                        onChange={(e) => setAge(e.target.value === '' ? '' : Math.max(1, parseInt(e.target.value, 10) || 0))}
                        className="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"
                      />
                      <span className="absolute right-3.5 top-2.5 text-xs text-slate-500 pointer-events-none">
                        years
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              <div className="space-y-4 pt-4 border-t border-slate-700/80">
                <div className="flex items-center gap-2">
                  <Icon name="Layers" className="w-5 h-5 text-emerald-400" />
                  <h3 className="font-semibold text-lg text-white">3. Planned Adventure Activities</h3>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  {AVAILABLE_ACTIVITIES.map(act => {
                    const isSelected = selectedActivities.includes(act.id);
                    return (
                      <button
                        key={act.id}
                        type="button"
                        onClick={() => toggleActivity(act.id)}
                        className={`flex items-start gap-3 p-3.5 rounded-xl border text-left transition-all ${isSelected
                          ? 'bg-emerald-950/40 border-emerald-500/80 ring-1 ring-emerald-500/50'
                          : 'bg-slate-900/60 border-slate-700/80'
                          }`}
                      >
                        <div className={`p-2 rounded-lg shrink-0 ${isSelected ? 'bg-emerald-500 text-slate-900' : 'bg-slate-800 text-slate-400'}`}>
                          <Icon name={act.iconName} className="w-5 h-5" />
                        </div>
                        <div>
                          <span className={`text-sm font-semibold ${isSelected ? 'text-emerald-300' : 'text-slate-200'}`}>
                            {act.name}
                          </span>
                          <p className="text-xs text-slate-400 mt-0.5">{act.desc}</p>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="pt-2">
                <button
                  type="button"
                  onClick={generatePackingList}
                  disabled={loadingWeather}
                  className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base transition-all active:scale-[0.99] disabled:opacity-50"
                >
                  <Icon name="Sparkles" className="w-5 h-5" />
                  {loadingWeather ? "Fetching Forecasts..." : "Generate Smart Packing List"}
                </button>
              </div>
            </section>

            {Object.keys(weatherData).length > 0 && (
              <section className="space-y-3">
                <h3 className="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <Icon name="Sun" className="w-4 h-4 text-amber-400" /> Weather Forecast Summary
                </h3>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {Object.entries(weatherData).map(([id, data]) => (
                    <div key={id} className="bg-slate-800/80 border border-slate-700/80 rounded-xl p-4 space-y-2">
                      <h4 className="font-bold text-white text-sm truncate">{data.displayName}</h4>
                      <div className="flex items-baseline justify-between pt-1">
                        <span className="text-lg font-bold text-slate-100">{data.minTemp}° - {data.maxTemp}°F</span>
                        <span className="text-xs font-semibold text-slate-400">{data.rainChance}% Rain</span>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {generatedList && (
              <section id="packing-results-section" className="space-y-6 pt-4 border-t border-slate-800">
                <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 sm:p-6 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h3 className="text-xl font-bold text-white flex items-center gap-2">
                        <Icon name="ShoppingBag" className="w-5 h-5 text-emerald-400" /> Your Customized Packing List
                      </h3>
                    </div>
                    <button
                      onClick={copyToClipboard}
                      className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5"
                    >
                      <Icon name="Copy" className="w-4 h-4" />
                      {copiedNotification ? 'Copied!' : 'Copy List'}
                    </button>
                  </div>

                  <div className="space-y-1.5 pt-2">
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-slate-400 font-medium">Packing Progress</span>
                      <span className="font-bold text-emerald-400">{checkedItemsCount} of {totalItemsCount} items packed ({packedPercentage}%)</span>
                    </div>
                    <div className="w-full bg-slate-900 rounded-full h-3 p-0.5 border border-slate-700">
                      <div className="bg-emerald-500 h-full rounded-full transition-all duration-300" style={{width: `${packedPercentage}%`}} />
                    </div>
                  </div>
                </div>

                <div className="space-y-6">
                  {Object.keys(generatedList).map(catName => {
                    const baseItems = generatedList[catName];
                    const extraItems = customItems[catName] || [];
                    const allItems = [...baseItems, ...extraItems];

                    if (allItems.length === 0) return null;

                    return (
                      <div key={catName} className="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-5 space-y-4">
                        <h4 className="font-bold text-slate-200 text-base">{catName}</h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                          {allItems.map(item => {
                            const isChecked = !!checkedItems[item.id];
                            return (
                              <div
                                key={item.id}
                                onClick={() => toggleCheck(item.id)}
                                className={`flex items-start justify-between gap-3 p-3 rounded-xl border cursor-pointer ${isChecked ? 'bg-slate-900/40 border-slate-800 text-slate-500 line-through' : 'bg-slate-900/80 border-slate-700 text-slate-200'
                                  }`}
                              >
                                <div>
                                  <span className="text-sm font-medium">{item.text}</span>
                                  {item.note && <p className="text-xs text-slate-400">{item.note}</p>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
